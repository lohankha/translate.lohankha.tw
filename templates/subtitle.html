{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="ltr">

<head>
  <meta http-equiv="Content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="{% trans '華語, 台語, 翻譯' %}">
  <meta name="description" content="{% trans '提供台英、台日、台韓、台華雙向機器翻譯的服務' %}">
  <meta property="og:url" content="https://lohankha.tw/" />
  <meta property="og:title" content="{% trans 'Lohankha Translate - 台語翻譯' %}" />
  <meta property="og:image" content="https://lohankha.tw/static/img/lohankha_wide.png" />
  <title>{% trans 'Lohankha Translate - 台語翻譯' %}</title>
  <link rel="shortcut icon" href="/static/img/favicon.ico">

  <link rel="alternate" type="application/rss+xml" title="RSS" href="/blog/feeds/rss/">
  <link rel="alternate" type="application/atom+xml" title="Atom" href="/blog/feeds/atom/">

  <link rel="stylesheet" href="/static/css/font.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/translation-form.js"></script>
</head>

<body id="body">
  <div class="container">
    <div class="row">
      <div class="my-3">
        {% include 'nav_tabs.html' %}
        {% block content %}
        <form class="mezzanine-form" method='POST' enctype="multipart/form-data" id="uploadForm">
          {% csrf_token %}
          <div class="row">
            <div class="form-floating col-md-6 mb-3">
              {{ input_form.input_lang }}
              <label class="ps-4" for="{{ input_form.input_lang.id_for_label }}">
                {{ input_form.input_lang.label }}</label>
            </div>
            <div class="form-floating col-md-3 mb-3">
              {{ output_form.output_format }}
              <label class="ps-4" for="{{ output_form.output_format.id_for_label }}">
                {{ output_form.output_format.label }}</label>
            </div>
            <div class="form-floating col-md-3 mb-3">
              {{ lmj_form.lmj }}
              <label class="ps-4" for="{{ lmj_form.lmj.id_for_label }}">
                {{ lmj_form.lmj.label }}</label>
            </div>
          </div>
          <div class="alert alert-danger" id="file-result" style="display: none;"></div>
          <div class="alert alert-info" id="upload-info" style="display: none;"></div>
          
          <div class="input-group">
            <input type="file" name="file" class="form-control" accept=".srt" id="id_file" required style="display: none;">
            <button type="button" class="btn btn-outline-secondary rounded-start" id="custom-file-button">
              <i class="bi bi-file-earmark"></i> <span id="file-button-text">{% trans 'Choose File' %}</span>
            </button>
            <span class="form-control" id="file-name-display">{% trans 'No file chosen' %}</span>
            <button class="btn btn-primary" type="submit" id="file-submit" disabled>
              <i class="bi bi-upload"></i> {% trans 'Upload' %}
            </button>
          </div>
        </form>
        {% endblock %}
      </div>
    </div>
    {% include 'footer.html' %}
  </div>
  <script>
    // Translation strings for JavaScript
    const translations = {
      fileEmpty: "{% trans 'Error: File is empty! Please select a valid SRT file.' %}",
      fileSizeExceeded: "{% trans 'File size cannot exceed 1MB!' %}",
      selectedFile: "{% trans 'Selected file:' %}",
      processing: "{% trans 'Processing...' %}",
      translationCompleted: "{% trans 'Translation completed! File should be downloading...' %}",
      translationFailed: "{% trans 'Translation failed. Please try again.' %}",
      chooseFile: "{% trans 'Choose File' %}",
      noFileChosen: "{% trans 'No file chosen' %}"
    };
    
    document.addEventListener('DOMContentLoaded', function() {
      let fileInput = document.getElementById("id_file");
      let customFileButton = document.getElementById("custom-file-button");
      let fileButtonText = document.getElementById("file-button-text");
      let fileNameDisplay = document.getElementById("file-name-display");
      let fileResult = document.getElementById("file-result");
      let fileSubmit = document.getElementById("file-submit");
      let uploadInfo = document.getElementById("upload-info");
      
      // Handle custom file button click
      if (customFileButton) {
        customFileButton.addEventListener("click", function() {
          fileInput.click();
        });
      }
      
      if (fileInput && fileResult && fileSubmit) {
        fileInput.addEventListener("change", function () {
          if (fileInput.files.length > 0) {
            const file = fileInput.files.item(0);
            const fileSize = file.size;
            const fileMb = fileSize / 1024 ** 2;
            
            // Update file display
            fileNameDisplay.textContent = file.name;
            fileButtonText.textContent = translations.chooseFile;
            
            // Check if file is empty
            if (fileSize === 0) {
              fileResult.innerHTML = translations.fileEmpty;
              fileResult.style.display = "block";
              fileSubmit.disabled = true;
              return;
            }
            
            // Check file size
            if (fileMb >= 1) {
              fileResult.innerHTML = translations.fileSizeExceeded;
              fileResult.style.display = "block";
              fileSubmit.disabled = true;
            } else {
              fileResult.style.display = "none";
              fileSubmit.disabled = false;
              
              // Show file info
              uploadInfo.innerHTML = `${translations.selectedFile} ${file.name} (${(fileSize / 1024).toFixed(1)} KB)`;
              uploadInfo.style.display = "block";
            }
          } else {
            // Reset to default state
            fileNameDisplay.textContent = translations.noFileChosen;
            fileButtonText.textContent = translations.chooseFile;
            fileResult.style.display = "none";
            uploadInfo.style.display = "none";
            fileSubmit.disabled = true;
          }
        });
      }
      
      // Add form submit handler
      let uploadForm = document.getElementById("uploadForm");
      if (uploadForm) {
        uploadForm.addEventListener("submit", function(e) {
          if (fileInput && fileInput.files.length > 0) {
            const file = fileInput.files.item(0);
            if (file.size === 0) {
              e.preventDefault();
              fileResult.innerHTML = translations.fileEmpty;
              fileResult.style.display = "block";
              return false;
            }
            
            // Show upload progress
            uploadInfo.innerHTML = translations.processing;
            uploadInfo.style.display = "block";
            fileSubmit.disabled = true;
            
            // Reset state after a delay (for file download)
            setTimeout(function() {
              uploadInfo.innerHTML = translations.translationCompleted;
              uploadInfo.className = "alert alert-success";
              // Reset button and file input, but keep success alert visible
              fileSubmit.disabled = false;
              fileInput.value = "";
            }, 3000);
            
            // Handle form submission errors
            uploadForm.addEventListener("error", function() {
              uploadInfo.innerHTML = translations.translationFailed;
              uploadInfo.className = "alert alert-danger";
              setTimeout(function() {
                uploadInfo.style.display = "none";
                uploadInfo.className = "alert alert-info"; // Reset to original style
                fileSubmit.disabled = false;
              }, 5000); // Show for 5 seconds
            });
          }
        });
      }
      
      // Initialize form options on page load
      updateOutputOptions();
    });
  </script>
</body>

</html>
